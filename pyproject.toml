[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hivecoder"
version = "1.0.0"
description = "Stateless micro-agent code generation orchestrator with AST-indexed shared memory and automated pytest verification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Veysel Gazi Duran" }
]
keywords = [
  "ai-agents",
  "autonomous-coding",
  "ollama",
  "blackboard-architecture",
  "ast",
  "apple-silicon",
  "local-llm"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators"
]
dependencies = [
  "rich>=13.7",
  "requests>=2.31",
  "pytest>=7.4",
  "pydantic>=2.5"
]

[project.urls]
Homepage = "https://github.com/VeyselGaziDuran/HiveCoder"
Repository = "https://github.com/VeyselGaziDuran/HiveCoder.git"
Issues = "https://github.com/VeyselGaziDuran/HiveCoder/issues"

[project.scripts]
hive = "hive:main"

[tool.setuptools]
py-modules = ["hive"]
packages = ["core", "agents", "ui", "probes"]
